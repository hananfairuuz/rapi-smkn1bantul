name: Deploy Laravel to DomaiNesia

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo, gd, zip, curl
          coverage: none

      - name: 📦 Install Composer Dependencies
        working-directory: latihanUKK2
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction --ignore-platform-reqs

      - name: 🟢 Setup Node.js & Compile Vite Assets
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🛠️ Build Frontend Assets
        working-directory: latihanUKK2
        run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Sync Files via FTP to DomaiNesia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.CPANEL_FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          local-dir: ./latihanUKK2/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tests/**
            .env
            .env.example
            *.md
            phpunit.xml

      - name: ⚡ Trigger Database Migration di Hosting
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET || secrets.DEPLOY_SECRET_KEY }}
        run: |
          TOKEN="${DEPLOY_SECRET:-skansaba_super_secret_token_12345}"
          curl -sS -k "https://rapi-smkn1bantul.web.id/api/deploy-migrate-${TOKEN}?seed=1" || echo "Webhook executed."

  mobile:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: rapi_mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: rapi_mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: rapi_mobile
        run: flutter test
